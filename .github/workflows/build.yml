name: Build Cross-Platform App

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: Windows-App-EXE
            file_extension: .exe
          - os: macos-latest
            artifact_name: macOS-App-Binary
            file_extension: ""

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconsole --onefile --collect-all gradio --collect-all sklearn --collect-all matplotlib --collect-all safehttpx --collect-all groovy app.py
    - name: Upload Executable
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: dist/*${{ matrix.file_extension }}
